name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version and extract notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          grep -q "project(aoahid_adb_proxy VERSION $ver " CMakeLists.txt
          awk -v v="$ver" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          test -s notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
